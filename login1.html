<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Placement Management Login</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen flex items-center justify-center bg-gradient-to-br from-blue-500 to-indigo-600">

  <div class="bg-white p-8 rounded-2xl shadow-2xl w-full max-w-md">
    
    <!-- Logo at the top -->
    <div class="flex justify-center mb-4">
      <img src="https://shikshaview.com/wp-content/uploads/2020/04/GRAPHIC-ERA-LOGO.jpg" alt="Organization Logo" class="h-24 w-24 rounded-full shadow-md">
    </div>

    <h2 class="text-3xl font-bold text-center text-indigo-700 mb-6">Placement Portal Login</h2>

    <form class="space-y-5" id="loginForm">
      <div>
        <label class="block mb-1 font-medium text-gray-700">Email</label>
        <input type="email" id="email" placeholder="student@example.com" class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-400" required>
      </div>

      <div>
        <label class="block mb-1 font-medium text-gray-700">Password</label>
        <input type="password" id="password" placeholder="••••••••" class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-400" required>
      </div>

      <!-- Remember me & Forgot password -->
      <div class="flex items-center justify-between text-sm">
        <label class="flex items-center gap-2 text-gray-700">
          <input type="checkbox" class="rounded" id="rememberMe" />
          Remember me
        </label>
        <a href="#" class="text-indigo-500 hover:underline">Forgot your password?</a>
      </div>

      <button type="submit" class="w-full bg-indigo-600 text-white py-2 rounded-lg hover:bg-indigo-700 transition duration-200">
        Login
      </button>

      <p class="text-center text-sm text-gray-600 mt-4">
        Don't have an account?
        <a href="#" class="text-indigo-500 hover:underline">Sign up</a>
      </p>
    </form>

    <p id="message" class="mt-4 text-center text-green-600 font-semibold hidden">Login successful! Redirecting...</p>
  </div>

  <script>
    const form = document.getElementById("loginForm");
    const message = document.getElementById("message");

    form.addEventListener("submit", function (e) {
      e.preventDefault();

      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value.trim();
      const remember = document.getElementById("rememberMe").checked;

      if (email && password) {
        console.log("Remember Me:", remember);
        message.classList.remove("hidden");

        setTimeout(() => {
          window.location.href = "dashboard.html";
        }, 1500);
      }
    });
  </script>

</body>
</html>
