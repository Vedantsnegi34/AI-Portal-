<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Resume Skill Analyzer</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-r from-indigo-100 to-purple-200 min-h-screen flex items-center justify-center font-sans">
    <div class="bg-white shadow-xl rounded-2xl p-8 w-full max-w-md">
        <h2 class="text-2xl font-bold text-center text-indigo-700 mb-6">Upload Your Resume</h2>

        <form action="/analyze" method="post" enctype="multipart/form-data" class="space-y-6">
            <div>
                <label class="block text-gray-700 font-medium mb-2" for="resume">Choose a file (.pdf or .docx)</label>
                <input 
                    type="file" 
                    name="resume" 
                    id="resume" 
                    accept=".pdf,.docx" 
                    required 
                    class="w-full border border-gray-300 p-2 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-400"
                >
            </div>

            <div class="text-center">
                <button 
                    type="submit" 
                    class="bg-indigo-600 text-white px-6 py-2 rounded-lg hover:bg-indigo-700 transition duration-300"
                >
                    Analyze Skills
                </button>
            </div>
        </form>
    </div>
</body>
</html>
