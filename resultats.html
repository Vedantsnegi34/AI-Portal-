<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>ATS Score Results</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans min-h-screen p-6">
    <div class="max-w-5xl mx-auto bg-white rounded-2xl shadow-xl p-8">
        <h2 class="text-3xl font-bold text-blue-700 mb-4">Job Description</h2>
        <h2 class="text-2xl font-semibold text-green-700 mb-4">Candidate Ranking</h2>
        <div class="overflow-x-auto">
            <table class="min-w-full border-collapse text-left text-gray-700">
                <thead>
                    <tr class="bg-green-100 border-b-2 border-green-300">
                        <th class="py-3 px-4">Rank</th>
                        <th class="py-3 px-4">Name</th>
                        <th class="py-3 px-4">ATS Score (%)</th>
                    </tr>
                </thead>
                <tbody>
                    <tr class="hover:bg-gray-50 border-b border-gray-200">
                        <td class="py-3 px-4 font-medium">{{ idx }}</td>
                        <td class="py-3 px-4">{{ c.name }}</td>
                        <td class="py-3 px-4">{{ c.score }}</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</body>
</html>
