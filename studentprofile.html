<div class="bg-white p-8 rounded-lg shadow-md">
  <h2 class="text-2xl font-bold text-gray-800 mb-4">Student Profile</h2>
  <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
    <input type="text" placeholder="Full Name" class="border px-4 py-2 rounded-lg" />
    <input type="text" placeholder="Roll Number" class="border px-4 py-2 rounded-lg" />
    <input type="email" placeholder="Email" class="border px-4 py-2 rounded-lg" />
    <input type="tel" placeholder="Phone" class="border px-4 py-2 rounded-lg" />
    <textarea placeholder="Skills / Summary" class="col-span-2 border px-4 py-2 rounded-lg"></textarea>
  </div>
</div>
