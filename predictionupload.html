<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Resume Upload - ATS Predictor</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100 text-gray-800">
    <div class="max-w-xl mx-auto mt-10 bg-white p-8 rounded-xl shadow-md">
        <h1 class="text-2xl font-bold mb-6 text-center">Upload Your Resume</h1>
        <form action="/predict" method="POST" enctype="multipart/form-data" class="space-y-4">
            <div>
                <label class="block font-medium">Resume (PDF or DOCX)</label>
                <input type="file" name="resume" accept=".pdf,.docx" required class="mt-1 block w-full border border-gray-300 rounded p-2">
            </div>
            <div>
                <label class="block font-medium">GPA</label>
                <input type="number" step="0.1" name="gpa" placeholder="e.g., 8.5" required class="mt-1 block w-full border border-gray-300 rounded p-2">
            </div>
            <div>
                <label class="block font-medium">Internship Count</label>
                <input type="number" name="internship" placeholder="e.g., 1" required class="mt-1 block w-full border border-gray-300 rounded p-2">
            </div>
            <div>
                <label class="block font-medium">Projects</label>
                <input type="number" name="projects" placeholder="e.g., 2" required class="mt-1 block w-full border border-gray-300 rounded p-2">
            </div>
            <div>
                <label class="block font-medium">Skills (comma separated)</label>
                <input type="text" name="skills" placeholder="e.g., Python, SQL, ML" required class="mt-1 block w-full border border-gray-300 rounded p-2">
            </div>
            <button type="submit" class="w-full bg-blue-600 text-white p-2 rounded hover:bg-blue-700 transition">Submit</button>
        </form>
    </div>
</body>
</html>
