<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Coordinator Login</title>

  <style>
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #94a3b8; /* slate-400 */
      margin: 0;
      font-family: sans-serif;
    }

    .container {
      background-color: #ffffff;
      padding: 2rem;
      border-radius: 1rem;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
      width: 100%;
      max-width: 400px;
    }

    .logo-wrapper {
      display: flex;
      justify-content: center;
      margin-bottom: 1rem;
    }

    .logo {
      height: 6rem;
      width: 6rem;
      border-radius: 50%;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
    }

    h2 {
      font-size: 1.875rem;
      font-weight: bold;
      text-align: center;
      color: #4338ca; /* indigo-700 */
      margin-bottom: 1.5rem;
    }

    form {
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
    }

    label {
      display: block;
      margin-bottom: 0.25rem;
      font-weight: 500;
      color: #374151; /* gray-700 */
    }

    input[type="email"],
    input[type="password"] {
      width: 100%;
      padding: 0.5rem 1rem;
      border: 1px solid #ccc;
      border-radius: 0.5rem;
      outline: none;
    }

    input:focus {
      border-color: #818cf8; /* indigo-400 */
      box-shadow: 0 0 0 2px rgba(129, 140, 248, 0.5);
    }

    .form-options {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.875rem;
    }

    .checkbox-label {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      color: #374151; /* gray-700 */
    }

    a {
      color: #6366f1; /* indigo-500 */
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }

    button {
      width: 100%;
      background-color: #4f46e5; /* indigo-600 */
      color: #fff;
      padding: 0.5rem 0;
      border: none;
      border-radius: 0.5rem;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    button:hover {
      background-color: #4338ca; /* indigo-700 */
    }

    .signup {
      text-align: center;
      font-size: 0.875rem;
      color: #4b5563; /* gray-600 */
      margin-top: 1rem;
    }

    .message {
      margin-top: 1rem;
      text-align: center;
      color: #16a34a; /* green-600 */
      font-weight: 600;
      display: none;
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- Logo at the top -->
    <div class="logo-wrapper">
      <img src="https://shikshaview.com/wp-content/uploads/2020/04/GRAPHIC-ERA-LOGO.jpg" alt="Organization Logo" class="logo">
    </div>

    <h2>Coordinator Login</h2>

    <form id="loginForm">
      <div>
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="coordinator@example.com" required>
      </div>

      <div>
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="••••••••" required>
      </div>

      <!-- Remember me & Forgot password -->
      <div class="form-options">
        <label class="checkbox-label">
          <input type="checkbox" id="rememberMe">
          Remember me
        </label>
        <a href="#">Forgot your password?</a>
      </div>

      <button type="submit">Login</button>

      <p class="signup">
        Don't have an account?
        <a href="#">Sign up</a>
      </p>
    </form>

    <p id="message" class="message">Login successful! Redirecting...</p>
  </div>

  <script>
    const form = document.getElementById("loginForm");
    const message = document.getElementById("message");

    form.addEventListener("submit", function (e) {
      e.preventDefault();

      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value.trim();
      const remember = document.getElementById("rememberMe").checked;

      if (email && password) {
        console.log("Remember Me:", remember);
        message.style.display = "block";

        setTimeout(() => {
          window.location.href = "dashboard.html";
        }, 1500);
      }
    });
  </script>
</body>
</html>
